# Local preview. Equivalent to script/serve.bash, which is what CI uses.
#
# HUGO_VERSION is duplicated from script/hugo.bash (and netlify.toml); keep them in step.
#   docker compose up
#   HUGO_VERSION=0.128.2 docker compose up

services:
  hugo:
    image: hugomods/hugo:exts-${HUGO_VERSION:-0.111.3}
    command: hugo server --bind 0.0.0.0 --port 1313
    # Match the host user, otherwise .hugo_build.lock is created as root and
    # every later non-root build fails with "permission denied".
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /src
    volumes:
      - ./:/src
    ports:
      - "1313:1313"
